services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lekkalu
      POSTGRES_PASSWORD: lekkalu
      POSTGRES_DB: lekkalu
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekkalu"]
      interval: 2s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lekkalu:lekkalu@postgres:5432/lekkalu
    ports: ["8000:8000"]
    volumes:
      - ./var:/app/var  # voice notes survive rebuilds; git-ignored
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
